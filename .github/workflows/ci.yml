name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# Dependencies come from vcpkg through .github/actions/install-vcpkg-dependencies, which
# pins the ports commit and holds the package list for this workflow and release.yml alike.

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every Linux *Release* job passes -DCMAKE_DISABLE_FIND_PACKAGE_slick-net=ON, which
          # sends the root CMakeLists down its FetchContent fallback so slick-net is compiled
          # by the same compiler, on the same machine, as the code that consumes it. It dates
          # from slick-net 3.x, which forced "-O3 -march=native" on Release builds, so the
          # libslick-net.a that vcpkg's binary cache replayed on a narrower runner died with
          # SIGILL inside the Websocket constructor; slick-net 4.x no longer does that by
          # default. For now the flag changes nothing: the pinned vcpkg commit (see
          # .github/actions/install-vcpkg-dependencies) carries slick-net 4.0.0, below this
          # repo's 4.1.1 floor, so every job builds slick-net from source anyway. It keeps
          # these jobs on the source build once vcpkg catches up. slick-net stays in the vcpkg
          # package list either way: the source build still needs its Boost/OpenSSL from there.
          # Pinned rather than default-GCC on purpose: GCC 11 and 13 ICE on an
          # initializer_list temporary held across a co_await (worked around in
          # trading_client_awaitable.cpp), and GCC 14 does not. If this job followed the
          # runner's default compiler, that regression guard would vanish silently the
          # day ubuntu-latest moves to GCC 14.
          - name: Linux GCC 13 / Release
            os: ubuntu-latest
            triplet: x64-linux
            generator: Ninja
            build_type: Release
            apt_packages: g++-13
            cmake_args: -DCMAKE_C_COMPILER=gcc-13 -DCMAKE_CXX_COMPILER=g++-13 -DCMAKE_DISABLE_FIND_PACKAGE_slick-net=ON
          # Follows the runner's default GCC, so newer releases get exercised too.
          - name: Linux GCC (default) / Debug
            os: ubuntu-latest
            triplet: x64-linux
            generator: Ninja
            build_type: Debug
            cmake_args: -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          # Clang would need the source build anyway, for a second and independent reason:
          # slick-net's Websocket constructor carries a trailing `requires std::default_initializable<BufferT>`,
          # and GCC and Clang mangle that clause into the symbol name differently, so Clang
          # objects cannot resolve the constructor out of the GCC-built libslick-net.a that
          # vcpkg installs -- every unconstrained member of the same class links fine, which
          # is what makes the failure look arbitrary.
          - name: Linux Clang / Release
            os: ubuntu-latest
            triplet: x64-linux
            generator: Ninja
            build_type: Release
            cmake_args: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_DISABLE_FIND_PACKAGE_slick-net=ON
          - name: Windows MSVC / Release
            os: windows-latest
            triplet: x64-windows
            # Empty: CMake selects the newest Visual Studio present on the runner.
            generator: ""
            build_type: Release
            cmake_args: -A x64

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install pinned compiler
        if: matrix.apt_packages != ''
        run: sudo apt-get install -y ${{ matrix.apt_packages }}

      - name: Install dependencies
        uses: ./.github/actions/install-vcpkg-dependencies
        with:
          triplet: ${{ matrix.triplet }}

      # googletest is resolved through FetchContent. "Fetching slick-net" and "Fetching
      # slick-logger" are expected in every job while the pinned vcpkg commit carries versions
      # below this repo's floors (see the action). Any other "Fetching slick-..." line means a
      # slick-* package was not taken from vcpkg, which is how two copies of one package end
      # up in the same build.
      - name: Configure
        run: |
          GEN=()
          if [ -n "${{ matrix.generator }}" ]; then GEN=(-G "${{ matrix.generator }}"); fi
          cmake -S . -B build "${GEN[@]}" \
            ${{ matrix.cmake_args }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DBUILD_ALPACA_OPTIONS_STREAMING=ON \
            -DBUILD_ALPACA_TESTS=ON \
            -DBUILD_ALPACA_EXAMPLES=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      # The six *Integration* suites need paper-trading and market-data credentials. They
      # GTEST_SKIP() themselves when none are configured, so excluding them here is about
      # not spending CI time on network round-trips that cannot assert anything.
      # --no-tests=error catches a silently broken gtest_discover_tests step.
      - name: Test (offline suites)
        run: |
          ctest --test-dir build \
            --build-config ${{ matrix.build_type }} \
            --output-on-failure \
            --no-tests=error \
            -E 'Integration'

  # Validates the exported package configs: the install tree must be consumable through
  # find_package(... CONFIG) by a project that knows nothing about this source tree. The
  # consumer never looks for msgpack itself, which checks that alpaca-options-streaming-cpp
  # really does keep it private.
  install-consume:
    name: Install + consume
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install dependencies
        uses: ./.github/actions/install-vcpkg-dependencies
        with:
          triplet: x64-linux

      - name: Build and install to a staging prefix
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DBUILD_ALPACA_OPTIONS_STREAMING=ON \
            -DBUILD_ALPACA_TESTS=OFF \
            -DBUILD_ALPACA_EXAMPLES=OFF
          cmake --build build --parallel
          cmake --install build --prefix "$GITHUB_WORKSPACE/stage"

      - name: Consume the installed package
        run: |
          mkdir -p consumer
          cat > consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.21)
          project(consumer LANGUAGES CXX)
          find_package(alpaca-cpp CONFIG REQUIRED)
          find_package(alpaca-options-streaming-cpp CONFIG REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE
            slick::alpaca-cpp slick::alpaca-options-streaming-cpp)
          EOF
          cat > consumer/main.cpp <<'EOF'
          #include <alpaca/alpaca.hpp>
          #include <alpaca/streaming/option_data_stream.hpp>
          int main() {
              const alpaca::trading_client client{alpaca::credentials("key", "secret")};
              const alpaca::option_data_stream stream{alpaca::credentials("key", "secret")};
              return client.base_url().empty() || stream.url().empty() ? 1 : 0;
          }
          EOF
          cmake -S consumer -B consumer/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/stage"
          cmake --build consumer/build --parallel
          ./consumer/build/consumer
